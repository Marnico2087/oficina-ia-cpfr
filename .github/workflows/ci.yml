name: Checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:public
      - run: npm run lint
      - run: npm run test:behavior
      - run: npm run build
      - run: npm run check:server
      - run: npm run package:vscode
      - uses: actions/upload-artifact@v4
        with:
          name: agent-office-vscode
          path: work/agent-office-vscode.vsix
