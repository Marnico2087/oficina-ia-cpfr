name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:public
      - run: npm run lint
      - run: npm run test:behavior
      - run: npm run test:ui
      - run: npm run build
      - run: npm run check:server
      - run: npm run package:vscode
      - uses: actions/upload-artifact@v4
        with:
          name: agent-office-vscode-${{ matrix.os }}
          path: work/agent-office-vscode.vsix
