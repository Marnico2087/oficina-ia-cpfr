name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify:public
      - run: npm run package:vscode
      # verify:public already built the production UI. Do not rerun prepack.
      - run: npm pack --ignore-scripts --pack-destination work
      - run: mv work/agent-office-*.tgz work/agent-office.tgz
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            work/agent-office-vscode.vsix
            work/agent-office.tgz
